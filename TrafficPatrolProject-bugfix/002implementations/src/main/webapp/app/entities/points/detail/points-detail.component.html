<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (points) {
      <div>
        <h2 data-cy="pointsDetailsHeading"><span jhiTranslate="trafficpatrolApp.points.detail.title">Points</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ points.id }}</span>
          </dd>
          <dt><span jhiTranslate="trafficpatrolApp.points.pointsEarned">Points Earned</span></dt>
          <dd>
            <span>{{ points.pointsEarned }}</span>
          </dd>
          <dt><span jhiTranslate="trafficpatrolApp.points.uploadDateTime">Upload Date Time</span></dt>
          <dd>
            <span>{{ points.uploadDateTime | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="trafficpatrolApp.points.appUser">App User</span></dt>
          <dd>
            @if (points.appUser) {
              <div>
                <a [routerLink]="['/app-user', points.appUser.id, 'view']">{{ points.appUser.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/points', points.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
